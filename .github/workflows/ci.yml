name: CI - Testen & Code-Qualität
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run paper trading tests
        working-directory: paper-trading
        run: npm test
      - name: Safety scan
        run: |
          if grep -RniE "createOrder|placeOrder|newOrder|withdraw|transferFunds|/order" paper-trading/src; then
            echo "Forbidden live-trading capability detected"
            exit 1
          fi
